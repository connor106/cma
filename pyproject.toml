[project]
name = "cma"
version = "0.1.0"
description = "Comparative market analysis for a Slack /cma address command"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
slack = ["slack-bolt>=1.21"]

[project.scripts]
cma = "cma.__main__:main"
cma-slack = "cma.slack_bot:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
